import org.gradle.api.file.DuplicatesStrategy

plugins {
    id 'base'
}

def versionName = providers.gradleProperty('mod_version').getOrElse('dev')

def platformBuild = { String taskName, String directory, List<String> nestedTasks, String nestedBuildName ->
    tasks.register(taskName, GradleBuild) {
        group = 'build'
        buildName = nestedBuildName
        dir = file(directory)
        tasks = nestedTasks
    }
}

platformBuild('buildForge1201', 'platforms/forge/1.20.1', ['reobfJar'], 'forge-1201')
platformBuild('compileForge1201', 'platforms/forge/1.20.1', ['compileJava'], 'forge-1201-compile')
platformBuild('buildNeoForge1211', 'platforms/neoforge/1.21.1', ['jar'], 'neoforge-1211')
platformBuild('compileNeoForge1211', 'platforms/neoforge/1.21.1', ['compileJava'], 'neoforge-1211-compile')

tasks.register('buildAllPlatforms') {
    group = 'build'
    description = 'Builds the Forge 1.20.1 and NeoForge 1.21.1 platform jars.'
    dependsOn tasks.named('buildForge1201'), tasks.named('buildNeoForge1211')
}

tasks.register('test', GradleBuild) {
    group = 'verification'
    description = 'Runs the shared LC2H test suite through the Forge platform classpath.'
    buildName = 'forge-1201-test'
    dir = file('platforms/forge/1.20.1')
    tasks = ['test']
}

tasks.register('buildOmniJar', Jar) {
    group = 'build'
    description = 'Builds the combined Forge 1.20.1 and NeoForge 1.21.1 LC2H jar.'
    dependsOn tasks.named('buildForge1201'), tasks.named('buildNeoForge1211')

    archiveFileName = "lc2h-omni-${versionName}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def forgeJar = file("platforms/forge/1.20.1/build/libs/lc2h-forge-1.20.1-${versionName}.jar")
    def neoForgeJar = file("platforms/neoforge/1.21.1/build-neo-gradle9/libs/lc2h-neoforge-1.21.1-${versionName}.jar")

    from({ zipTree(forgeJar) }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from({ zipTree(neoForgeJar) }) {
        exclude 'META-INF/MANIFEST.MF'
        include 'META-INF/neoforge.mods.toml'
        include 'mixins.lc2h.neoforge.json'
        include 'org/admany/lc2h/neoforge/**'
    }

    manifest {
        attributes(
            'Implementation-Title': 'lc2h-omni',
            'MixinConfigs': 'mixins.lc2h.json',
            'Implementation-Version': versionName,
            'Implementation-Vendor': providers.gradleProperty('mod_authors').getOrElse('Admany'),
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        )
    }
}

tasks.register('verifyOmniJar') {
    group = 'verification'
    description = 'Checks that the combined jar contains both loader payloads.'
    dependsOn tasks.named('buildOmniJar')
    doLast {
        def omniJar = tasks.named('buildOmniJar').get().archiveFile.get().asFile
        def entries = zipTree(omniJar)
        def required = [
            'META-INF/mods.toml',
            'META-INF/neoforge.mods.toml',
            'mixins.lc2h.json',
            'mixins.lc2h.neoforge.json',
            'org/admany/lc2h/LC2H.class',
            'org/admany/lc2h/neoforge/LC2H.class'
        ]
        def missing = required.findAll { entry -> entries.matching { include entry }.files.isEmpty() }
        if (!missing.isEmpty()) {
            throw new GradleException("Combined jar is missing: ${missing.join(', ')}")
        }
        new java.util.jar.JarFile(omniJar).withCloseable { jar ->
            def configs = jar.manifest?.mainAttributes?.getValue('MixinConfigs')
            if (configs != 'mixins.lc2h.json') {
                throw new GradleException('Combined jar must register the Forge mixins through MixinConfigs')
            }
            def neoMetadata = jar.getInputStream(jar.getJarEntry('META-INF/neoforge.mods.toml')).withCloseable {
                it.getText('UTF-8')
            }
            if (!(neoMetadata =~ /(?s)\[\[mixins\]\]\s*config\s*=\s*"mixins\.lc2h\.neoforge\.json"/).find()) {
                throw new GradleException('Combined jar must register the NeoForge mixins in neoforge.mods.toml')
            }
        }
        logger.lifecycle("Verified Forge and NeoForge payloads in ${omniJar.name}")
    }
}

tasks.register('lc2hVerifyProductionMixins', GradleBuild) {
    group = 'verification'
    description = 'Verifies the Forge production mixin configuration.'
    buildName = 'forge-1201-mixin-check'
    dir = file('platforms/forge/1.20.1')
