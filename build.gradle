tasks.named('assemble').configure {
    dependsOn tasks.named('buildOmniJar')
}

platformBuild('cleanForge1201', 'platforms/forge/1.20.1', ['clean'], 'forge-1201-clean')
platformBuild('cleanNeoForge1211', 'platforms/neoforge/1.21.1', ['clean'], 'neoforge-1211-clean')

tasks.named('clean').configure {
