tasks.register('lc2hCompareWorldParityExports', GradleBuild) {
    group = 'verification'
    description = 'Compares two LC2H world-parity exports.'
    buildName = 'forge-1201-world-parity'
    dir = file('platforms/forge/1.20.1')
