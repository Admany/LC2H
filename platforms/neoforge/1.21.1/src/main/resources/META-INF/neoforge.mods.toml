modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="lostcities"
    type="required"
    versionRange="[1.21,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="quantified"
    type="required"
    versionRange="[${quantified_version},)"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
    config="mixins.lc2h.neoforge.json"
