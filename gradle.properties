# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Admany
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=LC2H [Lost Cities: Multithreaded] is an addon for Lost Cities that uses Quantified API scheduling, exact Vulkan city-center compute with CPU fallback, optional experimental Vulkan/OpenCL region-prefilter support, and an asynchronous processing system to deliver significant performance improvements. It also includes extensive bug fixes for Lost Cities and general gameplay issues, along with a wide range of optimizations and QoL enhancements that make the game smoother, more stable, and overall much better to play.
# Local Quantified API jar version
quantified_version=2.2.2
